services:
  learningportal:
    # Keeps the service and volume names from before the rename, so an existing setup upgrades in place.
    image: ghcr.io/geeforceone/recall:latest
    # `docker compose up --build` builds from this checkout instead of pulling the published image.
    build: .
    ports:
      - "8080:8080"
    environment:
      # All persistent paths derive from this; override individually with
      # Storage__DatabasePath, Storage__FilesPath or Storage__KeysPath if needed.
      Storage__DataDirectory: /data
      # Per-file upload limit in bytes (default 50 MB).
      LearningPortal__MaxUploadBytes: "52428800"
    volumes:
      - learningportal-data:/data
    restart: unless-stopped

volumes:
  learningportal-data:
